<script>
(function(){
  var CFG = {"salt": "SWnzR820n+nFIaGKdyAa9A==", "iv": "QgjwdDh3jdikJJPk", "it": 310000, "tag": "smartrental", "v": "bd0937ea47"};
  var LS = 'gate_' + CFG.tag;
  var $ = function(i){ return document.getElementById(i); };
  var b64 = function(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var norm = function(s){ return (s || '').replace(/[\s\-]/g, '').toUpperCase(); };
  var store = {
    get: function(){ try { return localStorage.getItem(LS); } catch(e){ return null; } },
    set: function(v){ try { localStorage.setItem(LS, v); } catch(e){} },
    del: function(){ try { localStorage.removeItem(LS); } catch(e){} }
  };

  if (!window.crypto || !crypto.subtle || !window.DecompressionStream){
    $('e').textContent = 'Su navegador no es compatible. Ábralo con Chrome, Edge, Safari o Firefox actualizados.';
    $('b').disabled = true; return;
  }

  // Descarrega el contingut xifrat mentre l'usuari escriu
  var datos = fetch('d-' + CFG.v + '.bin', {cache: 'force-cache'})
    .then(function(r){ if (!r.ok) throw new Error('net'); return r.arrayBuffer(); });

  function abrir(code, recordar){
    $('b').disabled = true; $('e').textContent = ''; $('b').textContent = 'Abriendo…';
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(norm(code)), 'PBKDF2', false, ['deriveKey'])
      .then(function(k){
        return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(CFG.salt), iterations: CFG.it, hash: 'SHA-256'},
          k, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      })
      .then(function(key){
        return datos.then(function(ct){ return crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(CFG.iv)}, key, ct); });
      })
      .then(function(gz){
        var ds = new Response(gz).body.pipeThrough(new DecompressionStream('gzip'));
        return new Response(ds).text();
      })
      .then(function(html){
        if (recordar) store.set(norm(code)); else store.del();
        document.open(); document.write(html); document.close();
      })
      .catch(function(err){
        $('b').disabled = false; $('b').textContent = 'Entrar';
        if (err && err.message === 'net'){ $('e').textContent = 'No se ha podido cargar. Compruebe la conexión y vuelva a intentarlo.'; return; }
        store.del();
        $('e').textContent = 'Código incorrecto.';
        $('c').select();
      });
  }

  $('f').addEventListener('submit', function(ev){
    ev.preventDefault();
    var v = $('c').value;
    if (!norm(v)){ $('c').focus(); return; }
    abrir(v, $('r').checked);
  });

  var guardado = store.get();
  if (guardado) abrir(guardado, true);
})();
</script>
</body>
</html>
